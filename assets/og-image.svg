  <line x1="0" y1="0" x2="1200" y2="630" stroke="#30363d" stroke-width="0.5" opacity="0.3"/>
  <line x1="1200" y1="0" x2="0" y2="630" stroke="#30363d" stroke-width="0.5" opacity="0.3"/>
  <!-- glow -->
  <radialGradient id="g1" cx="50%" cy="40%" r="50%">
    <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <!-- title -->
  <text x="600" y="240" font-family="monospace" font-size="96" font-weight="900" text-anchor="middle" fill="#e6edf3" letter-spacing="-2">Geek<tspan fill="#58a6ff">Ref</tspan></text>
  <!-- subtitle -->
  <text x="600" y="310" font-family="sans-serif" font-size="26" text-anchor="middle" fill="#8b949e">مرجع سریع دستورات توسعه‌دهنده</text>
  <!-- tags -->
  <g font-family="monospace" font-size="18" fill="#30363d">
    <rect x="260" y="370" width="130" height="36" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="325" y="393" text-anchor="middle" fill="#f97316">UBUNTU</text>
    <rect x="410" y="370" width="130" height="36" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="475" y="393" text-anchor="middle" fill="#3fb950">DJANGO</text>
    <rect x="560" y="370" width="130" height="36" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="625" y="393" text-anchor="middle" fill="#f78166">PYTHON</text>
    <rect x="710" y="370" width="100" height="36" rx="6" fill="#161b22" stroke="#30363d"/>
